[project]
name = "frontapp-mcp-server"
version = "0.1.0"
description = "MCP server for the Frontapp API"
authors = [
    {name = "Doug Borg", email = "dougborg@dougborg.org"},
]
maintainers = [
    {name = "Doug Borg", email = "dougborg@dougborg.org"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = [
  "frontapp",
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "claude",
  "ai-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business",
  "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.13.0",
    "frontapp-openapi-client>=0.1.0",
    "prefab-ui>=0.19,<0.20",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "structlog>=25.5.0",
    "aiosqlite>=0.20.0",
    "platformdirs>=4.0.0",
]

# Note: Development dependencies like mcp-hmr require Python >=3.12
# Install manually for hot-reload development: uv pip install mcp-hmr
# See docs/mcp-server/DEVELOPMENT.md for setup instructions

[tool.uv.sources]
frontapp-openapi-client = { workspace = true }

[project.urls]
Homepage = "https://github.com/dougborg/frontapp-openapi-client"
Repository = "https://github.com/dougborg/frontapp-openapi-client"
Documentation = "https://dougborg.github.io/frontapp-openapi-client/"
"Bug Tracker" = "https://github.com/dougborg/frontapp-openapi-client/issues"

[project.scripts]
frontapp-mcp-server = "frontapp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontapp_mcp"]

# Pytest Configuration (Native TOML - pytest 9.0+)
[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests with mocks",
    "integration: Integration tests requiring API key",
]

# Versioning, changelog generation, and tagging are handled by release-please
# (see release-please-config.json and .release-please-manifest.json at the repo
# root) rather than python-semantic-release. See docs/RELEASE.md.
